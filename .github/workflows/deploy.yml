name: Vite site deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Handle nested folder if present
        run: |
          if [ -d "sqsh blls website" ] && [ ! -f "package.json" ]; then
            echo "Moving project files from nested 'sqsh blls website' folder to root..."
            shopt -s dotglob
            mv "sqsh blls website"/* .
            rmdir "sqsh blls website" || true
          fi

      - name: Install dependencies
        run: bun install || npm install

      - name: Build website
        run: bun run build || npm run build

      - name: Create 404.html fallback for SPA
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
